image: ghcr.io/li-langverse/lic-ci:ubuntu24-llvm22

stages:
  - build
  - verify
  - security

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - when: never

variables:
  DEBIAN_FRONTEND: noninteractive
  LI_LLVM_MAJOR: "22"
  LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
  CC: clang-22
  CXX: clang++-22
  GIT_DEPTH: "0"

compiler-build:
  stage: build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - chmod +x scripts/build.sh
    - ./scripts/build.sh
  artifacts:
    expire_in: 1 week
    paths:
      - build/compile_commands.json

compiler-mir-parity:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - chmod +x scripts/build.sh scripts/check_li_mir_parity.sh
    - ./scripts/build.sh
    - ./scripts/check_li_mir_parity.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/compile_commands.json

security-malformed-inputs:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - chmod +x scripts/build.sh li-tests/run_security.sh
    - ./scripts/build.sh
    - LIC="$CI_PROJECT_DIR/build/compiler/lic/lic" ./li-tests/run_security.sh
